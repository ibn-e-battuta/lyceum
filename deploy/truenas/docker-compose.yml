services:
  coursehub:
    image: ghcr.io/ibn-e-battuta/coursehub:latest
    user: "568:568"                     # TrueNAS "apps" user
    ports:
      - "8080:8080"
    volumes:
      - /mnt/tank/media/courses:/courses:ro
      - /mnt/tank/apps/coursehub:/config
    environment:
      TZ: Etc/UTC
    devices:
      - /dev/dri:/dev/dri               # Intel/AMD GPU for VAAPI (remove if you have none)
    group_add:
      - "44"                            # video
      - "107"                           # render (check with: getent group render)
    # NVIDIA instead of /dev/dri:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    restart: unless-stopped
