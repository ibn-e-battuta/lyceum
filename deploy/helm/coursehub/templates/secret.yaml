{{- if or (and .Values.admin.username (not .Values.admin.existingSecret)) (and .Values.oidc.clientSecret (not .Values.oidc.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coursehub.fullname" . }}
  labels: {{- include "coursehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.admin.username }}
  username: {{ .Values.admin.username | quote }}
  password: {{ .Values.admin.password | quote }}
  {{- end }}
  {{- if .Values.oidc.clientSecret }}
  clientSecret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
