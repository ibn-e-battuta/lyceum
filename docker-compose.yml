# CourseHub — copy this file, change the paths, then: docker compose up -d
services:
  coursehub:
    image: ghcr.io/OWNER/coursehub:latest   # replace OWNER, or use `build: .` to build from source
    container_name: coursehub
    # Run as your own user so CourseHub can write to ./config. Find your ids with `id -u` / `id -g`.
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - /path/to/your/courses:/courses:ro   # one folder per course; :ro is fine (remove it to edit course.json from the UI)
      - ./config:/config                    # database, sign-in keys, thumbnails, transcripts, speech model
    environment:
      TZ: Europe/London                     # for daily stats and streaks
      # Create the first admin automatically instead of using the setup page:
      # COURSEHUB_ADMIN_USER: admin
      # COURSEHUB_ADMIN_PASSWORD: change-me-please
      # Behind a reverse proxy (Nginx Proxy Manager, Caddy, Traefik, SWAG…):
      # CourseHub__TrustForwardedHeaders: "true"
    restart: unless-stopped
