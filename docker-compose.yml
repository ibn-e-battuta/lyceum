# Lyceum — copy this file, change the paths, then: docker compose up -d
services:
  lyceum:
    image: ghcr.io/ibn-e-battuta/lyceum:latest   # or use `build: .` to build from source
    container_name: lyceum
    # Run as your own user so Lyceum can write to ./config. Find your ids with `id -u` / `id -g`.
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - /path/to/your/courses:/courses:ro   # one folder per course; :ro is fine (remove it to edit course.json from the UI)
      - ./config:/config                    # database, sign-in keys, thumbnails, transcripts, speech model
    environment:
      TZ: Europe/London                     # for daily stats and streaks
      # Create the first admin automatically instead of using the setup page:
      # LYCEUM_ADMIN_USER: admin
      # LYCEUM_ADMIN_PASSWORD: change-me-please
      # Behind a reverse proxy (Nginx Proxy Manager, Caddy, Traefik, SWAG…):
      # Lyceum__TrustForwardedHeaders: "true"
      # Single sign-on (Authentik, Authelia, Keycloak…), see README:
      # Oidc__Authority: https://auth.example.com/application/o/lyceum/
      # Oidc__ClientId: lyceum
      # Oidc__ClientSecret: change-me
      # Oidc__AdminGroup: lyceum-admins
    # Intel/AMD hardware video conversion (choose VAAPI in Settings → Video playback):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ["video", "render"]
    # Reach Ollama running on the host for the AI tools (http://host.docker.internal:11434/v1):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: a local AI model for summaries, quizzes and "ask this course".
  # Use http://ollama:11434/v1 in Settings → AI, then: docker compose exec ollama ollama pull llama3.2
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ./ollama:/root/.ollama
  #   restart: unless-stopped
